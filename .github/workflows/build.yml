name: Build

# Runs the scanner tests and builds the phone apps on every push.
# Set the repository variable OMR_API_BASE (Settings > Secrets and variables >
# Actions > Variables) to your hosted server, e.g. https://omr.example.com
on:
  push:
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_real_sheets.py
      - run: pip install requests pymupdf cryptography && python -W ignore tests/test_kea_fetch.py && python -W ignore tests/test_key_pdfs.py

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Point the app at the server
        run: echo "window.OMR_API_BASE = \"${{ vars.OMR_API_BASE }}\";" > www/config.js
      - run: npx cap sync android
      - name: Debug APK (install on a phone to test)
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - name: Signed release bundle for Google Play
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        working-directory: mobile/android
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Point the app at the server
        run: echo "window.OMR_API_BASE = \"${{ vars.OMR_API_BASE }}\";" > www/config.js
      - run: npx cap sync ios
      - name: Build for the iPhone simulator (checks the iOS app compiles)
        shell: bash   # bash with pipefail, so a failed build is not hidden by "tail"
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
